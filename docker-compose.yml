services:
  app:
    build: .
    ports: ["3000:3000"]
    env_file: .env
    volumes:
      - ./data:/app/data        # SQLite persistence
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DB_PATH=/app/data/netremote.db
    # The entrypoint starts as root, chowns ./data to the `node` user (uid 1000),
    # then drops privileges. If your host user is NOT uid 1000, either run
    #   sudo chown -R 1000:1000 ./data
    # or uncomment the line below to run as your own uid:gid (no root needed):
    # user: "1000:1000"
  # cloudflared optional (user provides own credentials)
  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   command: tunnel --config /etc/cloudflared/config.yml run
  #   volumes:
  #     - ./cloudflared:/etc/cloudflared
  #   depends_on: [app]
  #   restart: unless-stopped

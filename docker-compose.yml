services:
  app:
    build: .
    ports: ["3000:3000"]
    env_file: .env
    volumes:
      - ./data:/app/data        # SQLite persistence
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DB_PATH=/app/data/netremote.db
